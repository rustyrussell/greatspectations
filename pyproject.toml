[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "greatspectations"
version = "0.2.3"
description = "Check that spec quotes in source comments match the spec"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Rusty Russell" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.urls]
Homepage = "https://greatspectations.com"
Repository = "https://github.com/rustyrussell/greatspectations"

[project.scripts]
greatspectate = "greatspectations.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src/greatspectations"]
python_version = "3.10"

[dependency-groups]
dev = [
    "mypy>=1.9",
    "pytest>=9.1.1",
    "tomli>=2.0",
]
