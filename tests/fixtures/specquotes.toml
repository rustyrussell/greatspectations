[sources.bolt]
format = "markdown"
dir = "bolt-style"
pattern = "{id:02d}-*.md"

[sources.bip]
format = "mediawiki"
dir = "bip-style"
pattern = "bip-{id:04d}.mediawiki"

[sources.cmdata-spec]
format = "markdown"
file = "cmdata-spec-style/SPECIFICATION.md"

[sources.rfc]
format = "rfc-text"
dir = "rfc-style"
pattern = "**/rfc{id}.txt.gz"
